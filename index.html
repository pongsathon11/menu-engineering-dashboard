<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Menu Engineering & Waste Reduction — interactive restaurant analytics web app. Menu matrix (Star/Plow Horse/Puzzle/Dog), basket pairing analysis, waste tracking, scenario simulator, full CRUD. Single-file HTML, no backend.">
<meta property="og:title" content="Menu Engineering & Waste Reduction System">
<meta property="og:description" content="Interactive restaurant analytics dashboard with menu matrix, basket pairing, waste analysis and scenario simulator. Built as a single-file web app.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#151b2c">
<meta name="author" content="Pongsatthon — Data Analyst">
<title>Menu Engineering & Waste Reduction System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#1c2333; --muted:#7c869c; --line:#e7eaf1;
  --accent:#ff7a30; --accent-soft:#fff1e8;
  --star:#16a34a; --plow:#2563eb; --puzzle:#9333ea; --dog:#dc2626;
  --star-bg:#e9f9ef; --plow-bg:#e8f0fe; --puzzle-bg:#f4ebfd; --dog-bg:#fdeaea;
  --shadow:0 1px 3px rgba(20,30,55,.06),0 6px 18px rgba(20,30,55,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Prompt',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.app{display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
.sidebar{width:230px;background:#151b2c;color:#aab2c5;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:20}
.logo{padding:22px 20px 18px;border-bottom:1px solid #232b40}
.logo .t1{color:#fff;font-weight:600;font-size:15px;line-height:1.3}
.logo .t2{font-size:11px;color:#6b7590;margin-top:2px}
.logo .badge{display:inline-block;margin-top:8px;background:var(--accent);color:#fff;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500}
.nav{flex:1;padding:14px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:13px;margin-bottom:2px;transition:.15s}
.nav-item:hover{background:#1e2740;color:#fff}
.nav-item.active{background:var(--accent);color:#fff;font-weight:500}
.nav-item .ic{width:20px;text-align:center;font-size:15px}
.side-foot{padding:14px 20px;border-top:1px solid #232b40;font-size:10.5px;color:#5d6780;line-height:1.5}
/* ---------- main ---------- */
.main{flex:1;margin-left:230px;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 26px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.topbar h1{font-size:17px;font-weight:600}
.topbar .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:12.5px;font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#c9cfdd;background:#f8f9fc}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn.primary:hover{background:#f06a1f}
.btn.danger{color:var(--dog);border-color:#f3c2c2}
.btn.danger:hover{background:var(--dog-bg)}
.btn.sm{padding:4px 9px;font-size:11.5px;border-radius:6px}
.lang-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang-toggle button{border:none;background:var(--card);padding:6px 11px;cursor:pointer;font-size:12px;font-family:inherit;color:var(--muted)}
.lang-toggle button.on{background:var(--ink);color:#fff;font-weight:500}
.content{padding:24px 26px;flex:1}
/* ---------- cards / grids ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border-radius:13px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi .lab{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.kpi .val{font-size:21px;font-weight:600;line-height:1.1}
.kpi .val small{font-size:12px;font-weight:400;color:var(--muted)}
.kpi .delta{font-size:11px;margin-top:5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid32{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-bottom:16px}
@media(max-width:1100px){.grid2,.grid32{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:13px;padding:18px 20px;box-shadow:var(--shadow)}
.card h3{font-size:13.5px;font-weight:600;margin-bottom:4px}
.card .desc{font-size:11.5px;color:var(--muted);margin-bottom:12px}
.chart-box{position:relative;height:260px}
.chart-box.tall{height:340px}
/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:9px 10px;color:var(--muted);font-weight:500;font-size:11.5px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th.num, td.num{text-align:right}
th:hover{color:var(--ink)}
td{padding:8px 10px;border-bottom:1px solid #f0f2f7;vertical-align:middle}
tr:hover td{background:#fafbfe}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:500}
.tag.STAR{background:var(--star-bg);color:var(--star)}
.tag.PLOW{background:var(--plow-bg);color:var(--plow)}
.tag.PUZZLE{background:var(--puzzle-bg);color:var(--puzzle)}
.tag.DOG{background:var(--dog-bg);color:var(--dog)}
.tag.warn{background:#fef3e2;color:#b45309}
.tag.ok{background:var(--star-bg);color:var(--star)}
.bar-cell{display:flex;align-items:center;gap:8px}
.mini-bar{height:6px;border-radius:4px;background:var(--accent);min-width:2px}
/* ---------- data page ---------- */
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tab{padding:8px 16px;border-radius:9px;cursor:pointer;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:500}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.search{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12.5px;font-family:inherit;width:230px;background:var(--card)}
.search:focus{outline:none;border-color:var(--accent)}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:12px;color:var(--muted)}
/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,20,35,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--card);border-radius:15px;padding:24px;width:430px;max-width:92vw;max-height:88vh;overflow-y:auto}
.modal h3{font-size:15px;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:13px;font-family:inherit;background:var(--card)}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
/* ---------- misc ---------- */
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:12.5px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .2s}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.quad-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px}
.quad-legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%}
.combo-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:16px}
.combo{background:linear-gradient(135deg,#fff7f1,#fff);border:1px solid #ffe1cc;border-radius:13px;padding:16px}
.combo .pair{font-weight:600;font-size:13.5px;margin-bottom:6px}
.combo .stat{font-size:11.5px;color:var(--muted);line-height:1.7}
.combo .stat b{color:var(--ink)}
.sim-grid{display:grid;grid-template-columns:340px 1fr;gap:16px}
@media(max-width:1000px){.sim-grid{grid-template-columns:1fr}}
.impact{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px solid #f0f2f7;font-size:12.5px}
.impact .l{color:var(--muted)}
.impact .arrow{color:var(--muted);margin:0 6px}
.up{color:var(--star);font-weight:600}
.down{color:var(--dog);font-weight:600}
.neutral{color:var(--muted)}
.actions-cell{white-space:nowrap}
.icon-btn{border:none;background:none;cursor:pointer;font-size:14px;padding:3px 5px;border-radius:6px;opacity:.55}
.icon-btn:hover{opacity:1;background:#f0f2f7}
.empty{text-align:center;color:var(--muted);padding:30px;font-size:12.5px}
.note{font-size:11px;color:var(--muted);background:#f8f9fc;border:1px solid var(--line);border-radius:9px;padding:9px 13px;margin-bottom:14px;line-height:1.6}
</style>
</head>

<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <div class="t1">🍽️ Menu Engineering</div>
      <div class="t2" data-i18n="appSub"></div>
      <span class="badge">DEMO · Web Database</span>
    </div>
    <nav class="nav" id="nav"></nav>

  <div class="main">
    <header class="topbar">
      <div><h1 id="pageTitle"></h1><div class="sub" id="pageSub"></div></div>
      <div class="top-actions">
        <div class="lang-toggle">

        <button class="btn danger" onclick="resetDemo()" id="btnReset"></button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
<div id="modalRoot"></div>
<input type="file" id="importFile" accept=".json" hidden onchange="importJSON(event)">

const realCost = m => m.cost*(1+m.wastePct);
const cmOf = m => m.price - realCost(m);
const marginOf = m => m.price>0 ? cmOf(m)/m.price : 0;
const fmt = (n,d=0) => n.toLocaleString(lang==='th'?'th-TH':'en-US',{minimumFractionDigits:d,maximumFractionDigits:d});

function calcStats(){
  const stats = {};
  db.menu.forEach(m => stats[m.id] = {m, qty:0, revenue:0, wasteQty:0, wasteVal:0});
  db.sales.forEach(s => { const st=stats[s.menuId]; if(st){ st.qty+=s.qty; st.revenue+=s.qty*st.m.price; }});
  db.waste.forEach(w => { const st=stats[w.menuId]; if(st){ st.wasteQty+=w.qty; st.wasteVal+=w.qty*realCost(st.m); }});
  const list = Object.values(stats);
  const n = list.length || 1;
  const avgQty = list.reduce((a,s)=>a+s.qty,0)/n;
  const avgCM = list.reduce((a,s)=>a+cmOf(s.m),0)/n;
  list.forEach(s => {
    s.cm = cmOf(s.m);
    s.pop = avgQty>0 ? s.qty/avgQty : 0;
    s.prof = avgCM>0 ? s.cm/avgCM : 0;
    s.cls = s.pop>=1 ? (s.prof>=1?'STAR':'PLOW') : (s.prof>=1?'PUZZLE':'DOG');
    s.cmTotal = s.cm*s.qty;
  });
  return {list, avgQty, avgCM};
}
function classify(pop, prof){ return pop>=1 ? (prof>=1?'STAR':'PLOW') : (prof>=1?'PUZZLE':'DOG'); }

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let billsCache = null;
/* menu affinity — plausible co-order patterns for the demo dataset */
const AFFINITY = {
  'M004':['M006','M005','M010','M015'],  // som tum + fried chicken / larb / lime juice / yum
  'M005':['M004','M006','M015'],
  'M006':['M004','M005','M010'],
  'M003':['M001','M009'],                // tom yum + fried rice, + dessert
  'M001':['M003','M011'],
  'M002':['M012','M011'],                // pad thai + satay + thai tea
  'M012':['M002'],
  'M013':['M011','M010'],
  'M014':['M011','M010'],
  'M009':['M011','M003'],
  'M010':['M004','M006','M013','M014'],
  'M011':['M001','M013','M014','M009','M002'],
  'M015':['M004','M005'],
  'M007':['M008'], 'M008':['M007']
};
function getBills(){
  if(billsCache) return billsCache;
  const rng = mulberry32(20260501);
  const byDate = {};
  db.sales.forEach(s => { (byDate[s.date] = byDate[s.date]||[]).push(s); });
  const bills = [];
  Object.keys(byDate).sort().forEach(date => {
    const counts = {};
    let total = 0;
    byDate[date].forEach(s => { counts[s.menuId]=(counts[s.menuId]||0)+s.qty; total+=s.qty; });
    const ids = Object.keys(counts);
    const pickWeighted = pool => {
      let sum = 0; pool.forEach(id=>sum+=counts[id]);
      if(!sum) return null;
      let r = rng()*sum;
      for(const id of pool){ r -= counts[id]; if(r<0) return id; }
      return pool[pool.length-1];
    };
    const take = id => { counts[id]--; total--; };
    while(total>0){
      const r = rng();
      const size = Math.min(total, r<0.18?1 : r<0.55?2 : r<0.85?3 : 4);
      const bill = [];
      for(let k=0;k<size;k++){
        let u = null;
        if(bill.length && rng()<0.62){
          const cand = [...new Set(bill.flatMap(x=>AFFINITY[x]||[]))].filter(id=>counts[id]>0);
          if(cand.length) u = pickWeighted(cand);
        }
        if(!u) u = pickWeighted(ids.filter(id=>counts[id]>0));
        if(!u) break;
        take(u); bill.push(u);
      }
      if(bill.length) bills.push([...new Set(bill)]);
    }
  });
  billsCache = bills;
  return bills;
}
function pairStats(){
  const bills = getBills();
  const cnt = {}, single = {};
  bills.forEach(b => {
    b.forEach(x => single[x]=(single[x]||0)+1);
    for(let i=0;i<b.length;i++) for(let j=i+1;j<b.length;j++){
      const key = [b[i],b[j]].sort().join('|');
      cnt[key]=(cnt[key]||0)+1;
    }
  });
  const N = bills.length;
  const pairs = Object.entries(cnt).map(([key,c])=>{
    const [a,b] = key.split('|');
    return {a, b, count:c, support:c/N, confAB:c/single[a], confBA:c/single[b],
      lift:(c*N)/(single[a]*single[b])};
  }).filter(p => p.count >= N*0.01 && menuById(p.a) && menuById(p.b));
  pairs.sort((x,y)=>y.lift-x.lift);
  return {pairs, N};
}

/* ================= basket ================= */
function pageBasket(){
  const {pairs, N} = pairStats();
  const {list} = calcStats();
  const clsOf = id => list.find(s=>s.m.id===id)?.cls;
  const top = pairs.slice(0,12);
  // combos: pairs with lift>1 where at least one is PUZZLE or STAR — best 3 by lift*count
  const combos = pairs.filter(p=>p.lift>1.05 && (['PUZZLE','STAR'].includes(clsOf(p.a))||['PUZZLE','STAR'].includes(clsOf(p.b)))).slice(0,3);
  const comboCard = p => {
    const A=menuById(p.a), B=menuById(p.b);
    const price = Math.round((A.price+B.price)*0.9/5)*5;
    const cm = price - realCost(A) - realCost(B);
    return `<div class="combo">
      <div class="pair">${mName(A)} + ${mName(B)}</div>
      <div class="stat">Lift <b>${fmt(p.lift,2)}×</b> — ${t('comboWhy')}<br>
      ${t('comboBuy')} <b>${fmt(p.count)}</b> ${t('bills')} (${pct(p.support,1)} ${t('comboOf')})<br>
      ${t('thComboPrice')}: <b>${fmtB(price)}</b> (−10%) · ${t('thPairCM')}: <b>${fmtB(cm,0)}</b></div>
    </div>`; };
  document.getElementById('content').innerHTML = `
  <div class="note">${t('basketNote')} · ${fmt(N)} ${t('bills')}</div>
  <h3 style="font-size:14px;margin-bottom:10px">🎁 ${t('comboTitle')}</h3>

    <table><thead><tr><th>${t('thPair')}</th><th class="num">${t('bills')}</th><th class="num">${t('thSupport')}</th><th class="num">${t('thConf')} (A→B)</th><th class="num">${t('thLift')}</th><th></th></tr></thead>

        <span class="tag ${clsOf(p.a)}" style="margin-left:4px">${CLS_LABEL[clsOf(p.a)]}</span><span class="tag ${clsOf(p.b)}" style="margin-left:3px">${CLS_LABEL[clsOf(p.b)]}</span></td>

        <td style="width:110px"><div class="mini-bar" style="width:${w}%"></div></td></tr>`;}).join('')}</tbody></table>
  </div>`;
}

    </div>
    <div class="card"><h3>${t('simResult')}</h3><div class="desc">${mName(m)} · ${lang==='th'?'ขายจริง':'sold'} ${fmt(s.qty)} ${t('items')}</div>
      <div id="simOut"></div>

    </div>

let simChart = null;
function simCalc(){
  const m = menuById(simMenuId);
  const {list, avgQty, avgCM} = calcStats();
  const s = list.find(x=>x.m.id===m.id);
  const nPrice = +document.getElementById('simPrice').value || 0;
  const nCost = +document.getElementById('simCost').value || 0;
  const nWaste = (+document.getElementById('simWaste').value || 0)/100;
  const qtyChg = (+document.getElementById('simQtyChg').value || 0)/100;
  const cur = { rc: realCost(m), cm: cmOf(m), mg: marginOf(m), qty: s.qty };
  cur.total = cur.cm*cur.qty; cur.rev = m.price*cur.qty; cur.cls = s.cls;
  const nu = { rc: nCost*(1+nWaste) };
  nu.cm = nPrice - nu.rc; nu.mg = nPrice>0? nu.cm/nPrice : 0; nu.qty = Math.round(s.qty*(1+qtyChg));
  nu.total = nu.cm*nu.qty; nu.rev = nPrice*nu.qty;
  // recompute averages replacing this menu
  const n = list.length;
  const avgQty2 = (avgQty*n - s.qty + nu.qty)/n;
  const avgCM2 = (avgCM*n - s.cm + nu.cm)/n;
  nu.cls = classify(avgQty2>0?nu.qty/avgQty2:0, avgCM2>0?nu.cm/avgCM2:0);
  const row = (lab, a, b, fmtF, invert=false) => {
    const d = b-a; const cl = d===0?'neutral':(d>0!==invert?'up':'down');
    return `<div class="impact"><span class="l">${lab}</span><span>${fmtF(a)}<span class="arrow">→</span><b>${fmtF(b)}</b> <span class="${cl}">${d===0?'':(d>0?'▲':'▼')} ${d===0?'':fmtF(Math.abs(d))}</span></span></div>`; };
  document.getElementById('simOut').innerHTML =
    row(t('simRealCost'), cur.rc, nu.rc, x=>fmtB(x,2), true) +
    row(t('simCM'), cur.cm, nu.cm, x=>fmtB(x,2)) +
    row(t('simMargin'), cur.mg, nu.mg, x=>pct(x,1)) +
    row(t('simRevM'), cur.rev, nu.rev, x=>fmtB(x)) +
    row(t('simMonthCM'), cur.total, nu.total, x=>fmtB(x)) +
    `<div class="impact"><span class="l">${t('simClass')}</span><span><span class="tag ${cur.cls}">${CLS_LABEL[cur.cls]}</span><span class="arrow">→</span><span class="tag ${nu.cls}">${CLS_LABEL[nu.cls]}</span></span></div>`;
  if(simChart){ simChart.destroy(); charts = charts.filter(c=>c!==simChart); }
  simChart = newChart('chSim',{type:'bar',data:{labels:[t('simRevM'),t('simMonthCM')],datasets:[
    {label:t('simCur'),data:[cur.rev,cur.total],backgroundColor:'#94a3b8b3',borderRadius:5},
    {label:t('simNew'),data:[nu.rev,nu.total],backgroundColor:'#ff7a30cc',borderRadius:5}]},
    options:{maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:12,font:{size:11}}}},scales:{y:{beginAtZero:true,ticks:{font:{size:10}}},x:{ticks:{font:{size:11}}}}}});
}

let dataTab = 'menu', dataSearch = '', dataPage = 1, dataSort = {key:null, dir:1};
const PAGE_SIZE = 15;
function pageData(){
  const tabs = [['menu',t('dataMenus'),db.menu.length],['sales',t('dataSales'),db.sales.length],['waste',t('dataWaste'),db.waste.length]];
  document.getElementById('content').innerHTML = `
  <div class="tabs">${tabs.map(([id,lab,n])=>`<div class="tab ${dataTab===id?'active':''}" onclick="dataTab='${id}';dataPage=1;dataSort={key:null,dir:1};render()">${lab} (${n})</div>`).join('')}</div>
  <div class="card">

      <input class="search" id="dataSearch" placeholder="${t('searchPh')}" value="${dataSearch}" oninput="dataSearch=this.value;dataPage=1;renderDataTable()">

    </div>
    <div id="dataTable"></div>
  </div>`;

}
function sortBy(key){ dataSort = dataSort.key===key ? {key, dir:-dataSort.dir} : {key, dir:1}; renderDataTable(); }
function arrow(key){ return dataSort.key===key ? (dataSort.dir>0?' ▲':' ▼') : ''; }

function renderDataTable(){
  const q = dataSearch.toLowerCase();
  let rows, html;
  if(dataTab==='menu'){
    rows = db.menu.filter(m => (m.id+m.name+(m.nameEn||'')+m.cat).toLowerCase().includes(q));
    if(dataSort.key) rows = [...rows].sort((a,b)=>{const k=dataSort.key; const va = k==='rc'?realCost(a):k==='mg'?marginOf(a):a[k]; const vb = k==='rc'?realCost(b):k==='mg'?marginOf(b):b[k]; return (va>vb?1:va<vb?-1:0)*dataSort.dir;});
    html = tableShell(rows.length, `
      <tr><th onclick="sortBy('id')">${t('thId')}${arrow('id')}</th><th onclick="sortBy('name')">${t('thName')}${arrow('name')}</th><th onclick="sortBy('cat')">${t('thCat')}${arrow('cat')}</th>
      <th class="num" onclick="sortBy('price')">${t('thPrice')}${arrow('price')}</th><th class="num" onclick="sortBy('cost')">${t('thCost')}${arrow('cost')}</th>
      <th class="num" onclick="sortBy('wastePct')">${t('thWastePct')}${arrow('wastePct')}</th><th class="num" onclick="sortBy('rc')">${t('thRealCost')}${arrow('rc')}</th>
      <th class="num" onclick="sortBy('mg')">${t('thMarginPct')}${arrow('mg')}</th><th></th></tr>`,
      pageRows(rows).map(m=>`<tr><td style="color:var(--muted)">${m.id}</td><td>${mName(m)}${lang==='th'&&m.nameEn?`<div style="font-size:10.5px;color:var(--muted)">${m.nameEn}</div>`:lang==='en'?`<div style="font-size:10.5px;color:var(--muted)">${m.name}</div>`:''}</td>
        <td style="color:var(--muted)">${catName(m.cat)}</td><td class="num">${fmt(m.price)}</td><td class="num">${fmt(m.cost)}</td>
        <td class="num">${fmt(m.wastePct*100,1)}%</td><td class="num">${fmt(realCost(m),2)}</td><td class="num">${pct(marginOf(m))}</td>
        <td class="actions-cell"><button class="icon-btn" title="${t('edit')}" onclick="openForm('menu','${m.id}')">✏️</button><button class="icon-btn" title="${t('del')}" onclick="delRow('menu','${m.id}')">🗑️</button></td></tr>`).join(''));
  } else if(dataTab==='sales'){
    rows = db.sales.filter(s => { const m=menuById(s.menuId); return (s.date+s.menuId+(m?m.name+(m.nameEn||''):'')).toLowerCase().includes(q); });
    const key = dataSort.key || 'date'; const dir = dataSort.key? dataSort.dir : -1;
    rows = [...rows].sort((a,b)=>{ const va = key==='rev'?(menuById(a.menuId)?.price||0)*a.qty : a[key]; const vb = key==='rev'?(menuById(b.menuId)?.price||0)*b.qty : b[key]; return (va>vb?1:va<vb?-1:0)*dir || b.id-a.id; });
    html = tableShell(rows.length, `
      <tr><th onclick="sortBy('date')">${t('thDate')}${arrow('date')}</th><th onclick="sortBy('menuId')">${t('thMenu')}${arrow('menuId')}</th>
      <th class="num" onclick="sortBy('qty')">${t('thSaleQty')}${arrow('qty')}</th><th class="num" onclick="sortBy('rev')">${t('thRev')}${arrow('rev')}</th><th></th></tr>`,
      pageRows(rows).map(s=>{ const m=menuById(s.menuId);
        return `<tr><td>${dispDate(s.date)}</td><td>${m?mName(m):s.menuId} <span style="color:var(--muted);font-size:10.5px">${s.menuId}</span></td>
        <td class="num">${fmt(s.qty)}</td><td class="num">${m?fmt(s.qty*m.price):'—'}</td>
        <td class="actions-cell"><button class="icon-btn" onclick="openForm('sales',${s.id})">✏️</button><button class="icon-btn" onclick="delRow('sales',${s.id})">🗑️</button></td></tr>`;}).join(''));
  } else {
    rows = db.waste.filter(w => { const m=menuById(w.menuId); return (w.date+w.menuId+w.reason+reasonName(w.reason)+(m?m.name+(m.nameEn||''):'')).toLowerCase().includes(q); });
    const key = dataSort.key || 'date'; const dir = dataSort.key? dataSort.dir : -1;
    rows = [...rows].sort((a,b)=>{ const va = key==='val'?(menuById(a.menuId)?realCost(menuById(a.menuId)):0)*a.qty : a[key]; const vb = key==='val'?(menuById(b.menuId)?realCost(menuById(b.menuId)):0)*b.qty : b[key]; return (va>vb?1:va<vb?-1:0)*dir || b.id-a.id; });
    html = tableShell(rows.length, `
      <tr><th onclick="sortBy('date')">${t('thDate')}${arrow('date')}</th><th onclick="sortBy('menuId')">${t('thMenu')}${arrow('menuId')}</th>
      <th class="num" onclick="sortBy('qty')">${t('thWasteQty')}${arrow('qty')}</th><th class="num" onclick="sortBy('val')">${t('thVal')}${arrow('val')}</th><th onclick="sortBy('reason')">${t('thReason')}${arrow('reason')}</th><th></th></tr>`,
      pageRows(rows).map(w=>{ const m=menuById(w.menuId);
        return `<tr><td>${dispDate(w.date)}</td><td>${m?mName(m):w.menuId} <span style="color:var(--muted);font-size:10.5px">${w.menuId}</span></td>
        <td class="num">${fmt(w.qty)}</td><td class="num">${m?fmt(w.qty*realCost(m),2):'—'}</td><td><span class="tag warn">${reasonName(w.reason)}</span></td>
        <td class="actions-cell"><button class="icon-btn" onclick="openForm('waste',${w.id})">✏️</button><button class="icon-btn" onclick="delRow('waste',${w.id})">🗑️</button></td></tr>`;}).join(''));
  }
  document.getElementById('dataTable').innerHTML = html;
}
function pageRows(rows){ return rows.slice((dataPage-1)*PAGE_SIZE, dataPage*PAGE_SIZE); }
function tableShell(total, thead, tbody){
  const pages = Math.max(1, Math.ceil(total/PAGE_SIZE));
  if(dataPage>pages) dataPage = pages;
  return `<table><thead>${thead}</thead><tbody>${tbody || `<tr><td colspan="9" class="empty">—</td></tr>`}</tbody></table>
  <div class="pager"><span>${t('showing')} ${total? (dataPage-1)*PAGE_SIZE+1:0}–${Math.min(dataPage*PAGE_SIZE,total)} ${t('of')} ${fmt(total)} ${t('rows')}</span>
  <button class="btn sm" ${dataPage<=1?'disabled':''} onclick="dataPage--;renderDataTable()">‹ ${t('prev')}</button>
  <button class="btn sm" ${dataPage>=pages?'disabled':''} onclick="dataPage++;renderDataTable()">${t('next')} ›</button></div>`;
}

/* ---------- forms ---------- */
function openForm(kind, id=null){
  const isEdit = id!==null;
  let m = {}, title;
  const today = new Date().toISOString().slice(0,10);
  if(kind==='menu'){ m = isEdit? {...menuById(id)} : {cat:CATS[0], wastePct:0.05, prep:5}; title = t(isEdit?'mEditMenu':'mAddMenu'); }
  if(kind==='sales'){ m = isEdit? {...db.sales.find(x=>x.id===id)} : {date:today, menuId:db.menu[0]?.id, qty:1}; title = t(isEdit?'mEditSale':'mAddSale'); }
  if(kind==='waste'){ m = isEdit? {...db.waste.find(x=>x.id===id)} : {date:today, menuId:db.menu[0]?.id, qty:1, reason:REASONS[0]}; title = t(isEdit?'mEditWaste':'mAddWaste'); }
  const menuOpts = sel => db.menu.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${x.id} — ${mName(x)}</option>`).join('');
  let body = '';
  if(kind==='menu') body = `
    <div class="frow"><div class="field"><label>${t('thName')} *</label><input id="f_name" value="${m.name||''}"></div>
    <div class="field"><label>${t('thNameEn')}</label><input id="f_nameEn" value="${m.nameEn||''}"></div></div>
    <div class="field"><label>${t('thCat')}</label><select id="f_cat">${CATS.map(c=>`<option value="${c}" ${c===m.cat?'selected':''}>${catName(c)}</option>`).join('')}</select></div>
    <div class="frow"><div class="field"><label>${t('thPrice')} *</label><input id="f_price" type="number" min="0" value="${m.price??''}"></div>
    <div class="field"><label>${t('thCost')} *</label><input id="f_cost" type="number" min="0" value="${m.cost??''}"></div></div>
    <div class="frow"><div class="field"><label>${t('thPrep')}</label><input id="f_prep" type="number" min="0" value="${m.prep??5}"></div>
    <div class="field"><label>${t('thWastePct')}</label><input id="f_waste" type="number" min="0" max="100" step="0.5" value="${m.wastePct!=null?fmt(m.wastePct*100,1):5}"></div></div>`;
  else { body = `
    <div class="field"><label>${t('thDate')} *</label><input id="f_date" type="date" value="${m.date}"></div>
    <div class="field"><label>${t('thMenu')}</label><select id="f_menu">${menuOpts(m.menuId)}</select></div>
    <div class="field"><label>${kind==='sales'?t('thSaleQty'):t('thWasteQty')} *</label><input id="f_qty" type="number" min="1" value="${m.qty??1}"></div>`;
    if(kind==='waste') body += `<div class="field"><label>${t('thReason')}</label><select id="f_reason">${REASONS.map(r=>`<option value="${r}" ${r===m.reason?'selected':''}>${reasonName(r)}</option>`).join('')}</select></div>`;
  }
  document.getElementById('modalRoot').innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal"><h3>${title}${isEdit&&kind==='menu'?` <span style="color:var(--muted);font-weight:400;font-size:12px">${m.id}</span>`:''}</h3>
      ${body}
      <div class="modal-actions"><button class="btn" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn primary" onclick="submitForm('${kind}', ${isEdit?(typeof id==='string'?`'${id}'`:id):null})">${t('save')}</button></div>
    </div></div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function submitForm(kind, id){
  const v = x => document.getElementById(x)?.value;
  if(kind==='menu'){
    const name = v('f_name').trim(), price = +v('f_price'), cost = +v('f_cost');
    if(!name || !(price>0) || !(cost>=0)) return;
    const rec = {name, nameEn:v('f_nameEn').trim(), cat:v('f_cat'), price, cost, prep:+v('f_prep')||0, wastePct:(+v('f_waste')||0)/100};
    if(id){ Object.assign(menuById(id), rec); } else { db.menu.push({id:nextMenuId(), ...rec}); }
  } else {
    const date = v('f_date'), qty = +v('f_qty');
    if(!date || !(qty>0)) return;
    const rec = {date, menuId:v('f_menu'), qty};
    if(kind==='waste') rec.reason = v('f_reason');
    const arr = db[kind];
    if(id){ Object.assign(arr.find(x=>x.id===id), rec); } else { arr.push({id:nextLogId(arr), ...rec}); }
  }
  saveDB(); closeModal(); toast(t('saved')); render();
}
function delRow(kind, id){
  if(kind==='menu'){
    if(!confirm(t('confirmDelMenu'))) return;
    db.menu = db.menu.filter(m=>m.id!==id);
    db.sales = db.sales.filter(s=>s.menuId!==id);
    db.waste = db.waste.filter(w=>w.menuId!==id);
  } else {
    if(!confirm(t('confirmDel'))) return;
    db[kind] = db[kind].filter(x=>x.id!==id);
  }
  saveDB(); toast(t('deleted')); render();
}

/* ================= export / import / reset ================= */
function exportJSON(){
  const blob = new Blob([JSON.stringify(db,null,1)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'menu_engineering_data.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function importJSON(ev){
  const file = ev.target.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      if(!Array.isArray(d.menu) || !Array.isArray(d.sales) || !Array.isArray(d.waste)) throw 0;
      db = d; saveDB(); toast(t('imported')); render();
    }catch(e){ toast(t('importErr')); }
  };
  rd.readAsText(file); ev.target.value='';
}
function resetDemo(){
  if(!confirm(t('confirmReset'))) return;
  db = JSON.parse(JSON.stringify(DEMO_DATA));
  saveDB(); toast(t('resetDone')); render();
}
let toastTimer;
function toast(msg){
  document.querySelectorAll('.toast').forEach(x=>x.remove());
  const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.remove(), 2200);
}

/* ================= init ================= */
Chart.defaults.font.family = "'Prompt',system-ui,sans-serif";
loadDB();
render();
</script>
